# 手動打包企業內網版:網站(不連外部 CDN、無頁面加密)+ 部署設定 + 程式碼與報告,完成後從 Artifacts 下載 zip。
name: 打包內網版

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        run: |
          python -m target_news_agent site -i reports -o build/site/news --root-redirect build/site
          if [ -f reports/dashboard/index.html ]; then
            mkdir -p build/site/financials
            cp reports/dashboard/index.html reports/dashboard/dashboard.json reports/dashboard/comparison.csv fin_analyzer/assets/og.png build/site/financials/
          fi
      - name: Package for the intranet
        run: python -m target_news_agent intranet --src build/site --out build/target-news-intranet --with-source
      - uses: actions/upload-artifact@v4
        with:
          name: target-news-intranet-${{ github.sha }}
          path: build/target-news-intranet
          retention-days: 30
