name: 靶材產業新聞
# 手動執行:Actions 頁面選「靶材產業新聞」→ Run workflow,可指定天數

on:
  schedule:
    - cron: "23 0 * * *"   # 每天 08:23(台北時間)
  workflow_dispatch:
    inputs:
      days:
        description: "蒐集最近幾天的新聞"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: target-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # 選填:設定這兩個 secrets 後,每次執行會把新聞同步到 Notion 資料庫
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect news and build report
        env:
          # 選填:設定後會用 Claude 產生中文摘要、重要度與本期總覽
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 選填:技術文獻搜尋(OpenAlex)用的聯絡 email / API key
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m target_news_agent -v run --days "${{ github.event.inputs.days || '3' }}"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "news: 靶材產業新聞 $(TZ=Asia/Taipei date +%F)"
          git push

      - name: Build site
        run: python -m target_news_agent site -i reports -o site/news --root-redirect site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Sync to Notion
        if: env.NOTION_TOKEN != '' && env.NOTION_DATABASE_ID != ''
        continue-on-error: true   # Notion 失敗只顯示警告,不擋網站發布;可之後手動重跑 notion-sync
        run: python -m target_news_agent -v notion-sync

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
