name: 靶材產業新聞

on:
  schedule:
    - cron: "23 0 * * *"   # 每天 08:23(台北時間)
  workflow_dispatch:
    inputs:
      days:
        description: "蒐集最近幾天的新聞"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: target-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect news and build report
        env:
          # 選填:設定後會用 Claude 產生中文摘要、重要度與本期總覽
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m target_news_agent -v run --days "${{ github.event.inputs.days || '3' }}"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "news: 靶材產業新聞 $(TZ=Asia/Taipei date +%F)"
          git push
