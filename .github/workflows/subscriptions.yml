name: 通知訂閱處理
# 每小時讀取寄件信箱(與貴金屬預警相同的 SMTP 帳號,以 IMAP 登入)中網站「訂閱通知」寄來的
# 「[TTMC-NOTIFY] SUBSCRIBE / UNSUBSCRIBE」信,回覆確認信並標為已讀。訂閱名單就是信箱裡的這些信,
# 貴金屬預警與週報寄出時會讀取它並以密件副本寄給訂閱者。
# Secrets:SMTP_HOST、SMTP_PORT、SMTP_USER、SMTP_PASSWORD、ALERT_EMAIL_FROM(選填)、IMAP_HOST(選填,預設由 SMTP_HOST 推得)。
# Gmail 需在帳號設定開啟 IMAP,SMTP_PASSWORD 使用應用程式密碼。

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscriptions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Answer subscription requests
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          SUBSCRIPTIONS: "on"
        run: python -m metal_alert -v subscriptions
