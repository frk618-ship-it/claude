name: 靶材製造商財務儀表板

on:
  schedule:
    - cron: "17 1 12 * *"   # 每月 12 日 09:17(台北時間),月營收於每月 10 日前公布
  workflow_dispatch:
    inputs:
      focus:
        description: "儀表板強調 / 深度報告的公司代號(留空 = 設定檔的 focus)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fin-report
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch financials (TW via FinMind, JP/US/CN via Yahoo Finance)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}   # 選填,提高 FinMind API 額度
        run: python -m fin_analyzer -v fetch

      - name: Build dashboard and focus-company report
        env:
          # 選填:設定後深度報告會加上 Claude 分析評論
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOCUS: ${{ github.event.inputs.focus }}
        run: |
          if [ -n "$FOCUS" ]; then
            python -m fin_analyzer -v dashboard --focus "$FOCUS"
            python -m fin_analyzer -v analyze --target "$FOCUS"
          else
            python -m fin_analyzer -v dashboard
            python -m fin_analyzer -v analyze
          fi

      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials reports/financials reports/dashboard
          git diff --cached --quiet || git commit -m "fin: 靶材製造商財務儀表板 $(TZ=Asia/Taipei date +%F)"
          git push
