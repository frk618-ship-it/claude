name: 發布網站
# 重新建置並發布 GitHub Pages:靶材新聞網站(/news/)與財務指標儀表板(/financials/),不蒐集新聞。
# 手動執行,或 main 上的儀表板更新時自動發布;每日的「靶材產業新聞」workflow 執行後也會發布。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["reports/dashboard/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        run: python -m target_news_agent site -i reports -o site/news --root-redirect site

      - name: Add financial dashboard
        run: |
          if [ -f reports/dashboard/index.html ]; then
            mkdir -p site/financials
            cp reports/dashboard/index.html reports/dashboard/dashboard.json reports/dashboard/comparison.csv fin_analyzer/assets/og.png site/financials/
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
