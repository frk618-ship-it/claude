name: 發布網站
# 重新建置並發布 GitHub Pages:靶材新聞網站(/news/)、財務指標儀表板(/financials/)、貴金屬預警(/metals/)與商機雷達(/leads/),不蒐集新聞。
# 手動執行,或 main 上的儀表板 / 報告 JSON 更新時自動發布(github-actions bot 的推送不會觸發);每日的「靶材產業新聞」workflow 執行後也會發布。

on:
  workflow_dispatch:
  workflow_call:          # 其他 workflow(例如「商機雷達」)commit 報告後呼叫,重新發布
    inputs:
      ref:
        description: "要建置的 commit / 分支(預設為觸發的 commit)"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["reports/dashboard/**", "reports/*.json", "config/forecasts.yaml", "config/quiz.yaml", "reports/leads/*.json"]  # 也包含排程任務補寫 Claude 摘要後的報告

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        run: python -m target_news_agent site -i reports -o site/news --root-redirect site

      - name: Add financial dashboard
        run: |
          if [ -f reports/dashboard/index.html ]; then
            mkdir -p site/financials
            cp reports/dashboard/index.html reports/dashboard/dashboard.json reports/dashboard/comparison.csv fin_analyzer/assets/og.png site/financials/
          fi

      - name: Add precious-metal alert page
        continue-on-error: true   # Yahoo 暫時無法連線時略過,下一次每小時排程會補上
        run: python -m metal_alert site --fetch -o site/metals

      - name: Add lead radar page
        continue-on-error: true   # 還沒有商機雷達報告時略過
        run: python -m lead_radar site -i reports/leads -o site/leads

      - uses: actions/configure-pages@v5

      - name: Protect site (secret path + password)
        env:
          # 在 repo 的 Settings → Secrets and variables → Actions 設定;沒設時只發布一個佔位頁,內容不會公開
          SITE_PATH: ${{ secrets.SITE_PATH }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python -m target_news_agent protect --src site --out public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 每日補寫的 Claude 摘要推送後會觸發這個 workflow:把最近兩份報告再同步到 Notion,
      # 補上先前同步時還沒有的標題譯文、摘要與重要度(已有重要度的資料列不動,保留手動編輯)
      - name: Sync summaries to Notion
        continue-on-error: true   # Notion 失敗只顯示警告,不擋網站發布
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PAPERS_DATABASE_ID: ${{ secrets.NOTION_PAPERS_DATABASE_ID }}
          NOTION_COMPANIES_DATABASE_ID: ${{ secrets.NOTION_COMPANIES_DATABASE_ID }}
        run: |
          # step-level env isn't visible to the step's own `if:`, so skip here when Notion isn't set up
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_PARENT_PAGE_ID$NOTION_DATABASE_ID$NOTION_PAPERS_DATABASE_ID" ]; then
            echo "Notion 未設定,略過"; exit 0
          fi
          for r in $(ls reports/????-??-??.json | sort | tail -2); do
            python -m target_news_agent -v notion-sync "$r"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
