name: 靶材產業週報
# 每週一台北時間約 09:47 把上週(週一至週日)的週報寄給貴金屬預警的 email 群組。
# 使用與「貴金屬價格預警」相同的 secrets:SMTP_HOST、SMTP_PORT、SMTP_USER、SMTP_PASSWORD、ALERT_EMAIL_TO、ALERT_EMAIL_FROM。
# 信中的「開啟完整週報」連到網站上的 week-<週一>.html(由 SITE_PATH 推得;也可用 WEEKLY_PAGE_URL 指定)。
# 週報網頁本身在每次「發布網站」時產生,不靠這個 workflow。

on:
  schedule:
    - cron: "47 1 * * 1"
  workflow_dispatch:
    inputs:
      monday:
        description: "週報那一週的週一(YYYY-MM-DD,留空 = 上週)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send weekly report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          WEEKLY_PAGE_URL: ${{ secrets.WEEKLY_PAGE_URL }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
          MONDAY: ${{ github.event.inputs.monday }}
        run: |
          if [ -n "$SITE_PATH" ]; then
            export SITE_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_PATH}"
          fi
          python -m target_news_agent -v weekly-email ${MONDAY:+--monday "$MONDAY"}
