name: 台股應收應付補完整科目
# 手動執行:從公開資訊觀測站完整資產負債表,把台股公司的應收/應付帳款改為「帳款+票據(含關係人)」
# (FinMind 是簡化報表,缺應付票據與關係人科目)。每季只抓一次並快取在 data/financials/<代號>/mops_trade.json;
# 之後每次「抓財報」都會自動套用快取並補抓新的季度。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fin-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update receivables / payables from MOPS
        run: python -m fin_analyzer -v mops-trade
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "fin: 台股應收/應付帳款及票據依公開資訊觀測站更新"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
