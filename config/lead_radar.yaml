# 商機雷達(lead_radar):製造業首次業務開發 — 找出「正在尋找」靶材、純鈦 / 鈦合金、鎳基合金的潛在客戶
#
# 概念:以「客群」(segments)為單位,把每一則公開資訊(新聞、標案、展會、詢價紀錄)當成一個「需求訊號」,
# 落到客群的「次產業 × 產品線」熱度網格上,用熱點分析(Getis-Ord Gi*)找出需求集中的區塊,
# 再把訊號歸到客群內的公司,依「產品適配 × 近期訊號」排出開發順序。
# 主要客群(primary_segment)是網站 /leads/ 的首頁;其他客群在 /leads/<key>/。
#
# 本檔可自由增刪:產品關鍵字、應用產業、需求訊號類型與權重、地區、目標客戶清單。
# 關鍵字比對不分大小寫,英文字詞以單字邊界比對("Ti" 不會比對到 "Time")。

settings:
  primary_segment: tw_semi_equipment   # 商機雷達的主要客群(網站首頁)
  title: 台灣設備廠                     # 頁面標題「商機雷達:<title>」;留空則顯示各客群名稱
  # 每個商機雷達頁面頁首的連結按鈕:url = 外部 http(s) 網址;page = 網站內頁(<網站>/leads/<page>/,只需網站密碼)
  # 業務報告:來源為 reports/leads/business_report.md(由 claude.ai 業務報告文件匯出),site 指令會產生 /leads/report/
  links:
    - {name: 業務報告, page: report}
  days: 30                 # 蒐集最近 N 天的新聞,也是熱度計算的時間窗
  half_life_days: 14       # 時間衰減半衰期:14 天前的訊號權重剩一半
  history_weeks: 8         # 回看幾週的熱度,判斷新興 / 持續 / 升溫 / 降溫
  request_delay: 0.6       # 每次抓取間隔秒數
  default_editions: [zh-TW, en]
  google_news: true
  bing_news: false
  feeds: []                # 自訂 RSS(例如標案、展會、產業公會新聞稿):- {name: "...", url: "https://...", edition: zh-TW}
  hotspot:
    z_hot: 1.96            # Gi* z ≥ 1.96(95% 信心)為熱點
    z_warm: 1.0            # Gi* z ≥ 1.0 為溫點(值得留意)
    min_signals: 2         # 熱點至少要有幾則訊號,避免單一新聞撐出熱點
    neighbor_weight: 0.3   # 鄰格權重(自己 = 1):同產業其他地區、同地區其他產業;1 = 標準二元 Gi*
  grades: {A: 70, B: 45, C: 25}   # 潛在客戶分數門檻(0–100)
  # 標題命中這些字詞多半是股市行情或股價新聞,權重 × noise_factor
  noise_terms: [股價, 漲停, 跌停, 目標價, 外資, 收盤, 盤中, 股東會, 熱門股, 小漲, 小跌, 即時新聞, 利好, 龍頭, 龙头, 淨利, 净利, 預增, 预增, 三季報, 三季报, 年報, 年报, 研報, 研报, 點評, 点评, 概念股,
                股市, 個股, 早盤, 盤前, 尾盤, 走揚, 上漲, 大漲, 漲勢, 漲幅, 亮燈, 千金股, 看盤, 估值, EPS, 存股, 爆料, 投顧, 選股, 成分股, 剔除, 波段, 操盤, 股倉, 誰更有戲, 誰先吃,
                台股, 大盤, 殺盤, 血崩, 權值股, 加權指數, 勁揚, 外銷訂單,
                stock price, shares rose, shares fell, price target, earnings, 株価]
  noise_factor: 0.3
  # ── 決策樹:擴廠規模 → 預估材料需求 → 規模分數 ──────────────────────────────
  # 報導標題中的金額(新台幣)× 意圖係數 × 次產業的材料占比 × 公司適配度 / 3 = 預估每年材料需求金額;
  # 取該公司最大的一筆,以對數刻度換成 0–100(100 萬元 = 0、10 億元 = 100),占綜合分數 weight。
  # 綜合分數 = 0.4 × 產品適配 + 0.6 × 訊號強度 + weight × 規模分數(上限 100;沒有金額新聞的公司分數不變)
  # !! 下列占比都是「粗估的規劃假設」,不是實際耗用量;請依實際接單與拜訪結果修正。
  estimate:
    weight: 0.15
    fx: {元: 1, 美元: 32, 日圓: 0.21, 歐元: 35, 人民幣: 4.5}      # 換算新台幣的概略匯率
    intents: {expansion: 1.0, tender: 1.0, contract: 0.5, maintenance: 0.3}   # 訂單金額是營收不是資本支出,打 5 折;歲修 3 折
    tree:                         # 客群 → 次產業 → 產品線:每 1 元投資 / 訂單金額對應的年材料需求
      tw_semi_production:         # 晶圓廠資本支出大、材料占比低;封裝的濺鍍與電鍍占比較高
        foundry:   {target: 0.003, copper: 0.001, nickel: 0.0005, titanium: 0.0002}
        memory:    {target: 0.003, copper: 0.001, nickel: 0.0005}
        packaging: {target: 0.004, copper: 0.003, titanium: 0.0005, evaporation: 0.0005}
        thinning:  {target: 0.002, copper: 0.001, evaporation: 0.002}
        testing:   {copper: 0.001}
      tw_semi_equipment:          # 設備與零組件廠:機台組件的材料占比
        front_end: {nickel: 0.010, titanium: 0.008, copper: 0.006, target: 0.004}
        packaging: {nickel: 0.006, titanium: 0.004, copper: 0.004}
        parts:     {titanium: 0.030, nickel: 0.030, copper: 0.010}
        facility:  {nickel: 0.010, titanium: 0.003, copper: 0.002}
        carrier:   {titanium: 0.005}
      tw_pcb_equipment:
        wet:        {copper: 0.030, titanium: 0.020, nickel: 0.010}
        imaging:    {titanium: 0.002, nickel: 0.002}
        drilling:   {titanium: 0.001}
        inspection: {titanium: 0.001}
        automation: {titanium: 0.001}
      tw_display_equipment:
        deposition: {target: 0.020, titanium: 0.010, copper: 0.010}
        wet:        {copper: 0.030, titanium: 0.020, nickel: 0.010}
        laser:      {titanium: 0.001}
        inspection: {titanium: 0.001}
        automation: {titanium: 0.001}
      tw_ai_server:
        cooling:      {copper: 0.080, nickel: 0.002}
        interconnect: {copper: 0.050}
        power:        {copper: 0.030}
        odm:          {copper: 0.002}
        chassis:      {copper: 0.001}
      tw_heavy_industry:
        steel:     {nickel: 0.004, copper: 0.002, titanium: 0.001}
        stainless: {nickel: 0.006, titanium: 0.003}
        refinery:  {nickel: 0.008, titanium: 0.005}
        chemical:  {titanium: 0.008, nickel: 0.006}
        epc:       {nickel: 0.010, titanium: 0.008}
      tw_cpo:
        laser_epi:   {target: 0.004, copper: 0.002, evaporation: 0.004}
        engine:      {copper: 0.010, target: 0.002}
        transceiver: {copper: 0.010}
        passive:     {copper: 0.002}
        coating:     {target: 0.030, titanium: 0.005, evaporation: 0.015}
        test:        {copper: 0.020}
        system:      {copper: 0.001}
  # 標題命中這些字詞直接捨棄:市場調查報告廣告、遊戲、產品評測與購物優惠(不是採購需求)
  drop_terms: [市場預測, 市场预测, 市場規模, 市场规模, 市場報告, 市场报告, 研究報告, 研究报告, 年預測, 年预测, CAGR, "Market to Reach", "Market Size", "Market Share",
               "Market Report", "Market Expansion", "Market Outlook", "Market Forecast", "Market Analysis", "market research",
               game, games, trailer, gameplay, PS5, Pokémon, hands-on, unboxing, "best gravel", discount, 評測, 开箱, 開箱, 遊戲, 游戏, 優惠, 折扣]
  # 自家公司與同業:不列為潛在客戶(新聞仍計入市場熱度)
  exclude_orgs: [鑫科, 鑫科材料, TTMC, 光洋科, Solar Applied, JX金屬, JX Advanced Metals, Materion, Plansee, 東曹, Tosoh, Honeywell, Solstice,
                 寶鈦, 宝钛, 西部超導, 西部超导, TIMET, VSMPO, ATI, Haynes, Special Metals, 撫順特鋼, 抚顺特钢, 鋼研高納, 钢研高纳, 大同特殊鋼]   # 中鋼已移入重工業客群(是設備零件的買方)

  editions:
    zh-TW: {hl: zh-TW, gl: TW, ceid: "TW:zh-Hant", region: TW}
    zh-CN: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans", region: CN}
    en:    {hl: en-US, gl: US, ceid: "US:en"}
    ja:    {hl: ja,    gl: JP, ceid: "JP:ja", region: JP}
    ko:    {hl: ko,    gl: KR, ceid: "KR:ko", region: KR}

# ── 產品線 ───────────────────────────────────────────────────────────────
# keywords   本地比對:新聞必須提到其中之一才算這條產品線的訊號
# search     搜尋用的精簡字詞(會與各應用產業的 search 字詞組成查詢)
# industries 這條產品線的目標應用產業(對應下方 industries 的 key);落在這些產業的公司「產業適配」最高
# pitch      業務切入話術重點(報告與名單的建議行動會帶出)
# pitch_source 切入重點的規格依據(例如「公司型錄 2026 版」);網頁、CSV 與報告會在切入重點旁顯示
products:
  - key: target
    name: 濺鍍靶材
    editions: [zh-TW, zh-CN, en, ja, ko]
    keywords: [靶材, 濺鍍, 濺射, 溅射, 磁控濺鍍, sputtering, sputter target, PVD, 物理氣相沉積, 物理气相沉积, 鍍膜, 镀膜, 薄膜沉積, thin film deposition,
               スパッタ, スパッタリングターゲット, 스퍼터링, ITO, IGZO, 旋轉靶, 旋转靶, rotary target]
    search: [靶材, 濺鍍, 溅射靶材, sputtering target, PVD]
    industries: [semiconductor, semi_equipment, display, display_equipment, solar, optical_coating, data_storage, hard_coating, cpo]
    pitch: 高純度(4N5–6N)金屬 / 合金靶、綁定與背板一站式、在地交期與殘靶回收
    pitch_source: "一般產業常見規格,尚未對照公司型錄與實際製造能力"   # 切入重點的規格依據;換成公司型錄後請改寫

  - key: titanium
    name: 純鈦 / 鈦合金
    editions: [zh-TW, zh-CN, en]
    keywords: [鈦, 钛, titanium, Ti-6Al-4V, Ti6Al4V, TC4, TA2, "Grade 2", "Grade 5", "Gr.2", "Gr.5", 鈦合金, 钛合金, 純鈦, 纯钛, チタン, 티타늄]
    search: [鈦合金, 純鈦, 钛合金, titanium alloy, titanium]
    exclude: [鈦媒體, 钛媒体, 鈦白粉, 钛白粉, 二氧化鈦, 二氧化钛, titanium dioxide, TiO2, 鈦白, 钛白, 鈦昇, 钛昇]   # 媒體名稱與顏料不是鈦金屬
    industries: [aerospace, medical, chemical, marine, consumer, sports, additive, hydrogen, semi_equipment, pcb_equipment, display_equipment, ai_server, steel, cpo]
    pitch: Gr.1–Gr.5 板 / 棒 / 線 / 粉,AS9100 / ISO 13485 文件、小量多樣與快速打樣
    pitch_source: "一般產業常見規格,尚未對照公司型錄與實際製造能力"

  - key: nickel
    name: 鎳基合金
    editions: [zh-TW, zh-CN, en]
    keywords: [鎳基合金, 镍基合金, 鎳合金, 镍合金, 高溫合金, 高温合金, 超合金, superalloy, nickel alloy, nickel-based alloy, Inconel, Hastelloy, Incoloy, Monel,
               "Inconel 718", "alloy 718", "alloy 625", C-276, GH4169, GH3625, ニッケル基合金, 超耐熱合金, 니켈합금]
    search: [鎳基合金, 高溫合金, 高温合金, Inconel, superalloy, nickel alloy]
    industries: [aerospace, power, oil_gas, chemical, hydrogen, additive, semiconductor, semi_equipment, pcb_equipment, display_equipment, ai_server, steel, cpo]
    exclude: [銅鎳合金, 铜镍合金, 銅鎳, 白銅]           # 銅基合金,歸銅材產品線
    pitch: 718 / 625 / C-276 等耐熱耐蝕牌號,鍛件 / 棒材 / 粉末,材料證明與航太 / 能源規範對應
    pitch_source: "一般產業常見規格,尚未對照公司型錄與實際製造能力"

  - key: copper
    name: 銅材 / 銅合金
    editions: [zh-TW, zh-CN, en]
    # 不用單字「銅」:銅牌、銅價、銅板價、銅鑼灣等都會誤判
    keywords: [銅材, 铜材, 銅合金, 铜合金, 無氧銅, 无氧铜, 高純銅, 高纯铜, 磷銅, 磷铜, 銅陽極, 铜阳极, 銅球, 铜球, 鈹銅, 铍铜, 鉻銅, 铬铜, 鉻鋯銅, 铬锆铜,
               銅鎳合金, 铜镍合金, 黃銅, 黄铜, 青銅, 銅板材, 銅棒, 铜棒, 銅管, 铜管, 銅排, 銅箔, 铜箔, 銅導線, 銅柱, 銅凸塊, 電鍍銅, 电镀铜, 銅製程,
               copper alloy, oxygen-free copper, OFHC, "OFC copper", beryllium copper, phosphorized copper, copper anode, copper foil, copper pillar, C10100, C10200, C18150]
    search: [銅合金, 無氧銅, 磷銅陽極, 電鍍銅, copper alloy]
    exclude: [銅牌, 銅鑼, 銅像, 青銅器, 銅板價, 銅價]
    industries: [semiconductor, semi_equipment, pcb_equipment, display_equipment, ai_server, display, power, consumer, steel, cpo]
    pitch: 無氧銅(C10100 / C10200)板棒管、磷銅陽極(球 / 板,電鍍銅用)、鈹銅與鉻鋯銅等高導電高強度合金,材質證明與潔淨包裝
    pitch_source: "一般產業常見規格,尚未對照公司型錄與實際製造能力"

  - key: evaporation
    name: 蒸鍍材料
    editions: [zh-TW, zh-CN, en, ja]
    # 電子束 / 熱蒸鍍用的金屬顆粒、錠與氧化物;「蒸鍍機」新聞多為面板 OLED 有機材料,只在客群公司新聞中才有意義
    keywords: [蒸鍍材料, 蒸镀材料, 蒸鍍源, 蒸鍍顆粒, 蒸鍍錠, 蒸發源, 蒸发源, 電子束蒸鍍, 电子束蒸镀, 熱蒸鍍, 蒸鍍, 蒸镀, 蒸著材料,
               evaporation material, evaporation materials, evaporation pellets, evaporation source, e-beam evaporation, electron beam evaporation,
               thermal evaporation, 蒸着材料, 증착재료]
    search: [蒸鍍材料, 電子束蒸鍍, evaporation material]
    industries: [semiconductor, semi_equipment, display, display_equipment, solar, optical_coating, cpo]
    pitch: 蒸鍍顆粒 / 錠(Ti、Ni、Cu、Al、Cr、Au、Ag 等金屬,及 SiO2、TiO2、Ta2O5 等氧化物),高純度 4N–6N,依坩堝尺寸客製、批次一致性與材質證明
    pitch_source: "一般產業常見規格,尚未對照公司型錄與實際製造能力"

