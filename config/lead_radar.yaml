                  weak: [投資, 投资, invest, commits],      # 「投資」要搭配廠 / 產線 / 設備等字詞,且不是財務投資
                  context: [廠, 厂, 產線, 产线, 設備, 设备, 擴, 扩, 興建, 動土, 產能, 产能, 規模, 園區, 基地, plant, fab, facility, capacity, line],
