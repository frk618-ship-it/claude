# ── 客群分析(segment)────────────────────────────────────────────────────
# 針對單一客群的深入分析:python -m lead_radar run --segment <key>
#   - 名單:客群內每家目標客戶都會列出(沒有新聞也會依產品適配度排名),再疊加近期需求訊號
#   - 熱點:在「次產業 × 產品線」網格上做 Gi* 熱點分析(例如「零組件與模組 × 鎳基合金」)
#   query_terms 搜尋公司新聞時附加的字詞;設備廠新聞很少直接提到材料,所以用擴產、訂單等字詞找動態
segments:
  tw_semi_equipment:        # 主要客群
    name: 台灣半導體設備廠
    description: 台灣半導體前段設備、先進封裝設備、關鍵零組件 / 模組、廠務與氣化系統、載具廠商;在 AI 與先進封裝擴產、設備國產化政策下持續擴廠
    industries: [semi_equipment]
    regions: [TW]
    editions: [zh-TW]
    days: 120              # 設備廠的擴產與認證週期長,用較長的時間窗
    half_life_days: 45
    query_terms: [擴產, 新廠, 擴廠, 訂單, 設備, 零組件, 國產化, 法說]
    subsegments:
      front_end: 前段製程設備
      packaging: 先進封裝設備
      parts: 關鍵零組件與模組
      facility: 廠務與氣化系統
      carrier: 載具與自動化

  tw_semi_production:
    name: 半導體生產供應鏈
    description: 台灣晶圓製造(晶圓代工、記憶體)、晶圓減薄與再生、封裝與測試廠商;先進製程、先進封裝(CoWoS、面板級封裝)與記憶體擴產帶動 PVD 濺鍍與廠務需求
    industries: [semiconductor]
    regions: [TW]
    editions: [zh-TW]
    days: 120
    half_life_days: 45
    query_terms: [擴產, 新廠, 擴廠, 資本支出, 先進封裝, 訂單, 量產, 建廠]
    subsegments:
      foundry: 晶圓代工
      memory: 記憶體
      thinning: 晶圓減薄與再生
      packaging: 封裝
      testing: 測試

