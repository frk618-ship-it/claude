# ── 需求訊號(意圖)──────────────────────────────────────────────────────
# weight  意圖強度:招標採購最強(明確在找供應商),政策補助最弱(只是可能)
# action  對應的業務下一步(名單上的「建議行動」)
intents:
  tender:        {name: 招標採購,   weight: 5.0, action: "立即索取標案 / RFQ 規格,確認投標資格、交期與截止日",
                  weak: [採購, 采购, 询价, 詢價, 比價],     # 也常出現在賣方或無關新聞:有 void 字詞時不算
                  void: [鋼價, 盤價, 開盤, 開出, 客戶, 買氣, 廉政, 庇護工場, 採購策略, 教育訓練, 執行率, 比價行情, 買油, 運費],
                  keywords: [招標, 招标, 標案, 公開招標, 徵求供應商, 征集供应商, tender, RFQ, RFP, request for quotation, request for proposal, procurement, sourcing, bid,
                             purchase order, seeks supplier, seeking suppliers, 入札, 調達, 입찰, 구매]}
  shortage:      {name: 缺料與交期, weight: 4.0, action: "主動提出可交貨量、交期與替代牌號 / 規格方案",
                  keywords: [缺貨, 缺料, 短缺, 供不應求, 供不应求, 交期, 斷鏈, 断供, 去中化, 吃緊, 吃紧, shortage, supply crunch, lead time, supply constraint, tight supply,
