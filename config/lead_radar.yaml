# 商機雷達(lead_radar):製造業首次業務開發 — 找出「正在尋找」靶材、純鈦 / 鈦合金、鎳基合金的潛在客戶
#
# 概念:把每一則公開資訊(新聞、標案、展會、詢價紀錄)當成一個「需求訊號」,
# 依「產品線 × 應用產業 × 地區」落到熱度網格上,用熱點分析(Getis-Ord Gi*)找出需求集中的區塊,
# 再把訊號歸到具體公司,依「意圖強度 × 產業適配 × 熱點加權 × 時間衰減」排出 A/B/C/D 級名單。
#
# 本檔可自由增刪:產品關鍵字、應用產業、需求訊號類型與權重、地區、目標客戶清單。
# 關鍵字比對不分大小寫,英文字詞以單字邊界比對("Ti" 不會比對到 "Time")。

settings:
  days: 30                 # 蒐集最近 N 天的新聞,也是熱度計算的時間窗
  half_life_days: 14       # 時間衰減半衰期:14 天前的訊號權重剩一半
  history_weeks: 8         # 回看幾週的熱度,判斷新興 / 持續 / 升溫 / 降溫
  request_delay: 0.6       # 每次抓取間隔秒數
  default_editions: [zh-TW, en]
  google_news: true
  bing_news: false
  feeds: []                # 自訂 RSS(例如標案、展會、產業公會新聞稿):- {name: "...", url: "https://...", edition: zh-TW}
  hotspot:
    z_hot: 1.96            # Gi* z ≥ 1.96(95% 信心)為熱點
    z_warm: 1.0            # Gi* z ≥ 1.0 為溫點(值得留意)
    min_signals: 2         # 熱點至少要有幾則訊號,避免單一新聞撐出熱點
    neighbor_weight: 0.3   # 鄰格權重(自己 = 1):同產業其他地區、同地區其他產業;1 = 標準二元 Gi*
  grades: {A: 70, B: 45, C: 25}   # 潛在客戶分數門檻(0–100)
  # 標題命中這些字詞多半是股市行情或股價新聞,權重 × noise_factor
  noise_terms: [股價, 漲停, 跌停, 目標價, 法說, 外資, 收盤, 盤中, 股東會, 熱門股, 小漲, 小跌, 即時新聞, 利好, 龍頭, 龙头, 淨利, 净利, 預增, 预增, 三季報, 三季报, 年報, 年报, 研報, 研报, 點評, 点评, 概念股,
                stock price, shares rose, shares fell, price target, earnings, 株価]
  noise_factor: 0.3
  # 標題命中這些字詞直接捨棄:市場調查報告廣告、遊戲、產品評測與購物優惠(不是採購需求)
  drop_terms: [市場預測, 市场预测, 市場規模, 市场规模, 市場報告, 市场报告, 研究報告, 研究报告, 年預測, 年预测, CAGR, "Market to Reach", "Market Size", "Market Share",
               "Market Report", "Market Expansion", "Market Outlook", "Market Forecast", "Market Analysis", "market research",
               game, games, trailer, gameplay, PS5, Pokémon, hands-on, unboxing, "best gravel", discount, 評測, 开箱, 開箱, 遊戲, 游戏, 優惠, 折扣]
  # 自家公司與同業:不列為潛在客戶(新聞仍計入市場熱度)
  exclude_orgs: [鑫科, 鑫科材料, TTMC, 光洋科, Solar Applied, JX金屬, JX Advanced Metals, Materion, Plansee, 東曹, Tosoh, Honeywell, Solstice,
                 寶鈦, 宝钛, 西部超導, 西部超导, TIMET, VSMPO, ATI, Haynes, Special Metals, 撫順特鋼, 抚顺特钢, 鋼研高納, 钢研高纳, 中鋼, 中钢, 大同特殊鋼]

  editions:
    zh-TW: {hl: zh-TW, gl: TW, ceid: "TW:zh-Hant", region: TW}
    zh-CN: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans", region: CN}
    en:    {hl: en-US, gl: US, ceid: "US:en"}
    ja:    {hl: ja,    gl: JP, ceid: "JP:ja", region: JP}
    ko:    {hl: ko,    gl: KR, ceid: "KR:ko", region: KR}

# ── 產品線 ───────────────────────────────────────────────────────────────
# keywords   本地比對:新聞必須提到其中之一才算這條產品線的訊號
# search     搜尋用的精簡字詞(會與各應用產業的 search 字詞組成查詢)
# industries 這條產品線的目標應用產業(對應下方 industries 的 key);落在這些產業的公司「產業適配」最高
# pitch      業務切入話術重點(報告與名單的建議行動會帶出)
products:
  - key: target
    name: 濺鍍靶材
    editions: [zh-TW, zh-CN, en, ja, ko]
    keywords: [靶材, 濺鍍, 濺射, 溅射, 磁控濺鍍, sputtering, sputter target, PVD, 物理氣相沉積, 物理气相沉积, 鍍膜, 镀膜, 薄膜沉積, thin film deposition,
               スパッタ, スパッタリングターゲット, 스퍼터링, ITO, IGZO, 旋轉靶, 旋转靶, rotary target]
    search: [靶材, 濺鍍, 溅射靶材, sputtering target, PVD]
    industries: [semiconductor, display, solar, optical_coating, data_storage, hard_coating]
    pitch: 高純度(4N5–6N)金屬 / 合金靶、綁定與背板一站式、在地交期與殘靶回收

  - key: titanium
    name: 純鈦 / 鈦合金
    editions: [zh-TW, zh-CN, en]
    keywords: [鈦, 钛, titanium, Ti-6Al-4V, Ti6Al4V, TC4, TA2, "Grade 2", "Grade 5", "Gr.2", "Gr.5", 鈦合金, 钛合金, 純鈦, 纯钛, チタン, 티타늄]
    search: [鈦合金, 純鈦, 钛合金, titanium alloy, titanium]
    exclude: [鈦媒體, 钛媒体, 鈦白粉, 钛白粉, 二氧化鈦, 二氧化钛, titanium dioxide, TiO2, 鈦白, 钛白]   # 媒體名稱與顏料不是鈦金屬
    industries: [aerospace, medical, chemical, marine, consumer, sports, additive, hydrogen]
    pitch: Gr.1–Gr.5 板 / 棒 / 線 / 粉,AS9100 / ISO 13485 文件、小量多樣與快速打樣

  - key: nickel
    name: 鎳基合金
    editions: [zh-TW, zh-CN, en]
    keywords: [鎳基合金, 镍基合金, 鎳合金, 镍合金, 高溫合金, 高温合金, 超合金, superalloy, nickel alloy, nickel-based alloy, Inconel, Hastelloy, Incoloy, Monel,
               "Inconel 718", "alloy 718", "alloy 625", C-276, GH4169, GH3625, ニッケル基合金, 超耐熱合金, 니켈합금]
    search: [鎳基合金, 高溫合金, 高温合金, Inconel, superalloy, nickel alloy]
    industries: [aerospace, power, oil_gas, chemical, hydrogen, additive, semiconductor]
    pitch: 718 / 625 / C-276 等耐熱耐蝕牌號,鍛件 / 棒材 / 粉末,材料證明與航太 / 能源規範對應

