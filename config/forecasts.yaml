forecasts:
  - id: fcr-2026-semiconductor-target
    source: 富士キメラ総研(Fuji Chimera Research Institute)
    report: 2026 先端/注目半導体関連市場の現状と将来展望
    section: C-5 ターゲット材(半導體濺鍍靶材)
    published: "2026-03-10"
    url: https://www.fcr.co.jp
    scope: 半導體導線、阻障層、種子層與電極墊形成用的濺鍍靶材(全球市場;2025 年為實績、2026 年為預估、2027 年起為預測)
    figures:
      - {label: "2025 年市場規模", value: "約 2,198 億日圓", note: "出貨約 28.3 萬片"}
      - {label: "2031 年預測", value: "約 3,497 億日圓", note: "出貨約 38.4 萬片"}
      - {label: "金額年複合成長率", value: "8.0%", note: "2025→2031(出貨量 5.2%)"}
      - {label: "2026 年金額成長", value: "約 +16%", note: "出貨量約 +6%"}
    points:
      - title: 市場概況
        items:
          - 靶材需求與半導體元件出貨量連動。2025 年伺服器等大量使用邏輯與記憶體的應用比 2024 年強勁,市場穩健成長。
          - 邏輯與 DRAM 用銅導線的鑲嵌種子層(Cu)與阻障層(Ta)靶材需求擴大最明顯。
          - 2026 年以後預期仍以邏輯與 DRAM 為主,隨半導體市況穩健成長;金額成長快於數量,反映高單價的 Cu、Ta 比重提升與金屬價格上漲。
      - title: 用途與材料
        items:
          - 依用途,導線(以 Al 為主)約占四成,其次為種子層(以 Cu 為主)、阻障層(Al 導線用 Ti 系、Cu 導線用 Ta 系)。種子層是先進邏輯與記憶體採用增加的重點用途,阻障層比重預期緩步上升。
          - 依材料,Al 最大宗、Ti 次之,Cu 與 Ta 比重逐年提高;Co 已用於部分先進製程,Ru 預期在先進製程中增加。
          - Al、Cu 用途廣、供應商多,價格競爭激烈;Ta 靶的單片價格最高。
      - title: 技術路線
        items:
          - 先進製程導線材料 2024–2026 年仍以 Cu 為主,2027 年以後逐步轉向 Co / Ru。
          - 原因是微細化使 Cu 導線電阻上升,且阻障層與種子層持續薄膜化。
      - title: 價格
        items:
          - 靶材價格隨原料金屬牌價變動;2025 年銅價高漲,Cu 靶價格呈上升趨勢。
      - title: 主要廠商
        items:
          - 江豐電子(KFMI)與 JX金屬是前兩大,合計約占七成出貨量,KFMI 略高於 JX金屬;兩家在先進邏輯與記憶體市占高,2025–2026 年成長率預期高於同業。其後依序為 Solstice Advanced Materials、東曹、Linde Advanced Material Technologies。
          - 江豐電子:Al 靶市占第一,也出貨 Ti、Ta、Cu;旗下有鋁原料子公司,具價格競爭力;記憶體客戶供貨強(為鎧俠等的主要供應商),已宣布設立韓國生產據點,瞄準韓國客戶並因應美國管制。
          - JX金屬:Cu 靶市占第一,Ti、Ta、W、Co 等產品線完整;先進製程市占高,供應台積電等客戶;據點在日本、韓國、台灣、美國。
          - Solstice Advanced Materials:2025 年 10 月自 Honeywell 電子材料分拆獨立,沿用其韓國、美國據點;Al 靶有一定市占,並聚焦先進邏輯。
          - 住友化學:專注 Al 系,從低純度鋁高純化到靶材一貫生產;以日本國內客戶為主,計劃增強設備拓展海外。
          - 東曹:以美國據點為主,Al 系靶材供應 Texas Instruments 等美國半導體廠,部分供應韓國,其他亞洲市場(含日本)幾乎未供貨。
          - 其他參與者包括 Linde、ULVAC、住友金屬礦山等。
    context: >-
      富士キメラ総研(2026/3)預測全球半導體濺鍍靶材市場金額 2025→2031 年 CAGR 約 8%,2026 年約 +16%;
      成長動能來自邏輯與 DRAM 的 Cu 種子層與 Ta 阻障層,先進製程導線 2027 年後逐步轉向 Co/Ru;
      江豐電子與 JX金屬合計約占七成。
