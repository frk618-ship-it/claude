# 靶材(Sputtering Target)產業新聞蒐集 — 追蹤清單與設定
#
# entities:
#   name            顯示名稱
#   role            producer(生產商) / distributor(銷售商、代理商) / equipment(濺鍍設備商)
#                   / process(製程相關:生產中使用 PVD 設備的半導體廠) / topic(產業主題)
#   region          地區,僅供報告顯示
#   ticker          股票代號(選填)
#   aliases         用來搜尋與比對新聞的名稱(中英日韓皆可)
#   require_context true = 公司業務範圍廣(例如 Solstice/Honeywell、三菱綜合材料),
#                   新聞必須同時出現 context_terms 中的靶材相關字詞才收錄
#   context_terms   (選填)這個項目專用的相關字詞,取代下方全域 context_terms;
#                   設備商用濺鍍 / PVD 字詞,避免收到蝕刻、CVD 等不相關新聞
#   editions        要搜尋的新聞版本(對應下方 editions),未填則用 default_editions

settings:
  days: 7                     # 只保留最近 N 天的新聞
  request_delay: 0.6          # 每次抓取之間的間隔秒數,避免被來源限流
  default_editions: [zh-TW, en]
  sources:
    google_news: true
    bing_news: false          # 可改 true 作為第二來源
    feeds: []                 # 自訂 RSS,例如公司新聞稿 RSS:
                              #  - {name: "Materion News", url: "https://..."}

  editions:
    zh-TW: {hl: zh-TW, gl: TW, ceid: "TW:zh-Hant"}
    zh-CN: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}
    en:    {hl: en-US, gl: US, ceid: "US:en"}
    ja:    {hl: ja,    gl: JP, ceid: "JP:ja"}
    ko:    {hl: ko,    gl: KR, ceid: "KR:ko"}

  # 寬業務公司(require_context)搜尋時附加的字詞,保持精簡以免查詢過長
  query_context_terms: [靶材, 濺鍍, 溅射, sputtering, スパッタリング, 스퍼터링]

  # 本地過濾用:判斷「與靶材相關」的字詞(require_context 的公司必須命中其一)
  context_terms:
    - 靶材
    - 濺鍍
    - 濺射
    - 溅射
    - 镀膜材料
    - 鍍膜材料
    - 高純
    - 高纯
    - sputtering
    - sputter target
    - target material
    - thin film
    - PVD
    - ITO
    - スパッタリング
    - ターゲット
    - 스퍼터링
    - 타겟

  # 新聞分類(依關鍵字比對,可多選);LLM 摘要啟用時會再校正分類
  categories:
    擴產與投資: [擴產, 扩产, 新廠, 新厂, 產能, 产能, 投資, 投资, 建廠, 建厂, 增資, 定增, expansion, expand, new plant, new facility, capacity, invest, 増産, 新工場, 設備投資, 증설, 신공장, 생산능력, 설비투자, 투자]
    營收與財報: [營收, 营收, 財報, 财报, 獲利, 盈利, 淨利, 净利, 毛利, EPS, 業績, 业绩, revenue, earnings, profit, quarter, guidance, 決算, 売上, 営業利益, 매출, 실적, 영업이익, 순이익, 분기]
    併購與合作: [併購, 并购, 收購, 收购, 合併, 合资, 合資, 策略聯盟, 戰略合作, 战略合作, 簽約, 签约, acquisition, acquire, merger, joint venture, partnership, agreement, 買収, 提携, 合弁, 인수, 합병, 합작, 제휴, 업무협약, MOU]
    原物料與價格: [價格, 价格, 漲價, 涨价, 報價, 报价, 原料, 原材料, 鉭, 钽, 銦, 铟, 鈷, 钴, 鎢, 钨, 鉬, 钼, 釕, 钌, 銅價, 铜价, price, prices, tantalum, indium, cobalt, tungsten, molybdenum, ruthenium, 価格, 値上げ, 가격, 원자재, 탄탈, 인듐, 코발트, 텅스텐, 몰리브덴, 루테늄]
    技術與新產品: [新產品, 新产品, 研發, 研发, 專利, 专利, 技術, 技术, 突破, 量產, 量产, 國產化, 国产化, 先進製程, 先进制程, launch, develop, patent, technology, breakthrough, 開発, 新製品, 量産, 신제품, 개발, 특허, 기술, 양산, 국산화]
    客戶與供應鏈: [台積電, 台积电, TSMC, 三星, Samsung, Intel, 英特爾, 中芯, SMIC, 美光, Micron, SK海力士, SK hynix, 京東方, 京东方, BOE, 面板, 供應鏈, 供应链, 認證, 认证, 驗證, 客戶, 客户, supplier, supply chain, qualification, customer, 삼성전자, SK하이닉스, LG디스플레이, 공급망, 고객사, 협력사, 인증]
    政策與貿易: [關稅, 关税, 出口管制, 管制, 制裁, 補貼, 补贴, 政策, tariff, export control, sanction, subsidy, CHIPS Act, 輸出規制, 関税, 관세, 수출 규제, 수출통제, 제재, 보조금]

  # 熱門關鍵字統計的候選詞(材料、應用)
  hot_terms: [鉭, 钽, 銅, 铜, 鋁, 铝, 鈦, 钛, 鈷, 钴, 鎢, 钨, 鉬, 钼, 釕, 钌, 鉑, ITO, IGZO, 氧化物, tantalum, copper, aluminum, titanium, cobalt, tungsten, molybdenum, ruthenium, 半導體, 半导体, 面板, 光伏, 太陽能, HJT, 先進封裝, 先进封装, semiconductor, display, solar, AI, HBM]

