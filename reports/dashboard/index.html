  const W = 560, H = 330, L = 48, R = 16, T = 12, B = 34;
  const xs = pts.map(c => val(c, "revenue_ttm_yoy")), ys = pts.map(c => val(c, "operating_margin_ttm"));
  const xt = niceTicks(Math.min(0, ...xs), Math.max(0, ...xs), 5), yt = niceTicks(Math.min(0, ...ys), Math.max(0, ...ys), 5);
  const X = v => L + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * (W - L - R);
  const Y = v => H - B - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (H - T - B);
  const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "營業利益率與營收成長散佈圖"});
  for (const t of xt) { svg.appendChild(sv("line", {x1: X(t), x2: X(t), y1: T, y2: H - B, class: t === 0 ? "baseline" : "gridline"}));
    svg.appendChild(sv("text", {x: X(t), y: H - B + 16, "text-anchor": "middle", class: "muted"}, fmtAxis(t, "pct"))); }
  for (const t of yt) { svg.appendChild(sv("line", {x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: t === 0 ? "baseline" : "gridline"}));
    svg.appendChild(sv("text", {x: L - 6, y: Y(t) + 4, "text-anchor": "end", class: "muted"}, fmtAxis(t, "pct"))); }
  svg.appendChild(sv("text", {x: W - R, y: H - 4, "text-anchor": "end", class: "muted"}, "近四季營收年增 →"));
  svg.appendChild(sv("text", {x: L, y: T - 2, class: "muted"}, "↑ 營業利益率"));
  const order = [...pts].sort((a, b) => (a.ticker === state.focus) - (b.ticker === state.focus));
  for (const c of order) {
    const cx = X(val(c, "revenue_ttm_yoy")), cy = Y(val(c, "operating_margin_ttm"));
    const isF = c.ticker === state.focus;
    const dot = sv("circle", {cx, cy, r: isF ? 6 : 5, fill: isF ? cssVar("--s1") : cssVar("--other-mark"), stroke: cssVar("--surface"), "stroke-width": 2});
    svg.appendChild(dot);
    const right = cx < W - 110;
    svg.appendChild(sv("text", {x: right ? cx + 9 : cx - 9, y: cy + 4, "text-anchor": right ? "start" : "end", class: isF ? "strong" : ""}, shortName(c)));
    const hit = sv("circle", {cx, cy, r: 14, fill: "transparent", tabindex: 0});
    const rows = [{label: "近四季營收年增", value: fmt(val(c, "revenue_ttm_yoy"), "pct")},
      {label: "營業利益率", value: fmt(val(c, "operating_margin_ttm"), "pct")},
      {label: `近四季營收(${D.unit_label})`, value: fmt(val(c, "revenue_ttm"), "amt")}];
    hit.addEventListener("pointermove", e => showTip(e, `${c.name}(${c.ticker})`, rows));
    hit.addEventListener("pointerleave", hideTip);
    hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); showTip({clientX: b.right, clientY: b.top}, `${c.name}(${c.ticker})`, rows); });
    hit.addEventListener("blur", hideTip);
    svg.appendChild(hit);
  }
  box.appendChild(svg);
}

// ---------- line chart (trend & monthly) ----------
function lineChart(box, series, xLabels, kind, ariaLabel) {
  box.replaceChildren();
  const all = series.flatMap(s => xLabels.map(x => s.values[x]).filter(v => v !== null && v !== undefined));
  if (!all.length) { box.appendChild(el("div", {class: "empty"}, "沒有可顯示的資料")); return; }
  const legend = el("div", {class: "legend"});
  for (const s of series) { const item = el("span"); const k = el("i"); k.style.background = s.color; item.append(k, document.createTextNode(s.name)); legend.appendChild(item); }
  box.appendChild(legend);
  const W = 560, H = 280, L = 48, R = 76, T = 10, B = 28;
  const yt = niceTicks(Math.min(kind === "amt" ? 0 : Math.min(0, ...all), ...all), Math.max(...all), 5);
  const X = i => L + (xLabels.length === 1 ? (W - L - R) / 2 : i / (xLabels.length - 1) * (W - L - R));
  const Y = v => H - B - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (H - T - B);
  const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": ariaLabel});
  for (const t of yt) { svg.appendChild(sv("line", {x1: L, x2: W - R, y1: Y(t), y2: Y(t), class: t === 0 && yt[0] < 0 ? "baseline" : "gridline"}));
    svg.appendChild(sv("text", {x: L - 6, y: Y(t) + 4, "text-anchor": "end", class: "muted"}, fmtAxis(t, kind))); }
  svg.appendChild(sv("line", {x1: L, x2: W - R, y1: H - B, y2: H - B, class: "baseline"}));
  const every = Math.ceil(xLabels.length / 6);
  const last = xLabels.length - 1;
  xLabels.forEach((xl, i) => { if ((i % every === 0 && last - i >= every * 0.75) || i === last)
    svg.appendChild(sv("text", {x: X(i), y: H - B + 16, "text-anchor": "middle", class: "muted"}, xl)); });
  const ends = [];
  for (const s of series) {
    let d = "", pen = false;
    xLabels.forEach((xl, i) => { const v = s.values[xl];
      if (v === null || v === undefined) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    svg.appendChild(sv("path", {d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    const lastI = xLabels.map(xl => s.values[xl]).map((v, i) => v === null || v === undefined ? -1 : i).filter(i => i >= 0).pop();
    if (lastI !== undefined) {
      svg.appendChild(sv("circle", {cx: X(lastI), cy: Y(s.values[xLabels[lastI]]), r: 3.5, fill: s.color, stroke: cssVar("--surface"), "stroke-width": 2}));
      ends.push({y: Y(s.values[xLabels[lastI]]), x: X(lastI), name: s.short});
    }
  }
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  for (const e of ends) svg.appendChild(sv("text", {x: W - R + 8, y: e.y + 4}, e.name));
  const cross = sv("line", {y1: T, y2: H - B, stroke: cssVar("--axis"), "stroke-width": 1, visibility: "hidden"});
  svg.appendChild(cross);
  const hit = sv("rect", {x: L - 10, y: T, width: W - L - R + 20, height: H - T - B, fill: "transparent"});
  hit.addEventListener("pointermove", e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(xLabels.length - 1, Math.round((p.x - L) / ((W - L - R) / Math.max(1, xLabels.length - 1)))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    showTip(e, xLabels[i], series.map(s => ({label: s.name, value: fmt(s.values[xLabels[i]], kind), color: s.color})));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  svg.appendChild(hit);
  box.appendChild(svg);
}

function renderTrend() {
  const pick = $("trend-pick"); pick.replaceChildren();
  const list = visible();
  for (const c of list) {
    const on = !!state.trendSel[c.ticker];
    const b = el("button", {class: "chip", type: "button", "aria-pressed": String(on)});
    if (on) { const k = el("i"); k.style.cssText = `display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:middle;background:${cssVar(state.trendSel[c.ticker])}`; b.appendChild(k); }
    b.appendChild(document.createTextNode(shortName(c)));
    b.onclick = () => { if (on) delete state.trendSel[c.ticker]; else addTrend(c.ticker, true); renderTrend(); };
    pick.appendChild(b);
  }
  const m = trendByKey[state.trendMetric];
  const sel = list.filter(c => state.trendSel[c.ticker]);
  const periods = [...new Set(sel.flatMap(c => Object.keys(c.trend)))].sort();
  const series = sel.map(c => ({name: `${c.name}(${c.ticker})`, short: shortName(c), color: cssVar(state.trendSel[c.ticker]),
    values: Object.fromEntries(periods.map(p => [p, c.trend[p] ? c.trend[p][m.key] : null]))}));
  if (!series.length) { $("trend").replaceChildren(el("div", {class: "empty"}, "請在上方選擇公司")); return; }
  lineChart($("trend"), series, periods, m.kind, m.label + " 季度趨勢");
}

function renderMonthly() {
  const tw = D.companies.filter(c => Object.keys(c.monthly).length).slice(0, 4);
  $("monthly-card").style.display = tw.length ? "" : "none";
  if (!tw.length) return;
  const months = [...new Set(tw.flatMap(c => Object.keys(c.monthly)))].sort().slice(-24);
  const series = tw.map((c, i) => ({name: `${c.name}(${c.ticker})`, short: shortName(c), color: cssVar(SLOTS[i]),
    values: Object.fromEntries(months.map(mo => [mo, c.monthly[mo] ? c.monthly[mo].yoy : null]))}));
  lineChart($("monthly"), series, months, "pct", "台股月營收年增率");
}

// ---------- table ----------
function renderTable() {
  const tbl = $("table"); tbl.replaceChildren();
  const list = visible();
  const thead = el("thead"), g = el("tr"), h = el("tr");
  g.appendChild(el("th", {class: "grp"}, ""));
  h.appendChild(el("th", {}, "公司"));
  g.appendChild(el("th", {class: "grp"}, "")); h.appendChild(el("th", {}, "最新季"));
  g.appendChild(el("th", {class: "grp"}, "")); h.appendChild(el("th", {}, "訊號"));
  let group = null, span = null;
  for (const m of D.metrics) {
    if (m.group !== group) { group = m.group; span = el("th", {class: "grp", colspan: 0}, group); g.appendChild(span); }
    span.setAttribute("colspan", String(+span.getAttribute("colspan") + 1));
    const th = el("th", {scope: "col", tabindex: 0, title: m.better === "low" ? "越低越好" : m.better === "high" ? "越高越好" : ""},
      (m.kind === "amt" ? m.label + "(" + D.unit_label + ")" : m.label) + (state.sortKey === m.key ? (state.sortDir < 0 ? " ▼" : " ▲") : ""));
    const sort = () => { if (state.sortKey === m.key) state.sortDir *= -1; else { state.sortKey = m.key; state.sortDir = m.better === "low" ? 1 : -1; } renderTable(); };
    th.onclick = sort; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(); } };
    h.appendChild(th);
  }
  thead.append(g, h); tbl.appendChild(thead);
  const rows = [...list];
  if (state.sortKey) rows.sort((a, b) => { const va = val(a, state.sortKey), vb = val(b, state.sortKey);
    if (va === null) return 1; if (vb === null) return -1; return (va - vb) * state.sortDir; });
  const best = {};
  for (const m of D.metrics) { if (!m.better) continue; const vs = list.map(c => val(c, m.key)).filter(v => v !== null);
    if (vs.length > 1) best[m.key] = m.better === "high" ? Math.max(...vs) : Math.min(...vs); }
  const tbody = el("tbody");
  for (const c of rows) {
    const tr = el("tr", {class: c.ticker === state.focus ? "focus" : ""});
    const name = el("td");
    name.append(document.createTextNode(c.name + (c.target_focus === "diversified" ? "＊" : "")), el("br"),
      el("span", {class: "t"}, `${c.ticker} · ${c.region} · ${c.focus_label || "—"}`));
    tr.appendChild(name);
    tr.appendChild(el("td", {}, c.latest_quarter));
    const sc = c.signal_counts;
    tr.appendChild(el("td", {title: "風險 / 注意 / 優勢"}, `🔴${sc["風險"] || 0} 🟡${sc["注意"] || 0} 🟢${sc["優勢"] || 0}`));
    for (const m of D.metrics) {
      const v = val(c, m.key);
      const td = el("td", {}, fmt(v, m.kind));
      if (v !== null && best[m.key] === v) td.classList.add("best");
      if (v !== null && v < 0 && ["pct", "amt"].includes(m.kind)) td.classList.add("neg");
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
}

// ---------- signals & notes ----------
function renderSignals() {
  const c = D.companies.find(x => x.ticker === state.focus);
  $("sig-title").textContent = `重點訊號 — ${c ? c.name : ""}`;
  const ul = $("signals"); ul.replaceChildren();
  if (!c || !c.signals.length) { ul.appendChild(el("li", {}, "未觸發任何規則門檻。")); return; }
  const icon = {"風險": "🔴", "注意": "🟡", "優勢": "🟢"};
  for (const s of c.signals) ul.appendChild(el("li", {}, `${icon[s.level] || ""} ${s.level}|${s.topic}:${s.message}`));
}
function renderNotes() {
  const ul = $("notes");
  const items = [
    "資料來源:台股為 FinMind(公開資訊觀測站財報),日本/美國/中國大陸為 Yahoo Finance;各公司最新季度可能不同,請對照「最新季」欄位。",
    "近四季(TTM)= 最近四季加總;ROE/ROA 以期初(去年同季)與期末平均權益/資產計算;天數指標以單季營收或營業成本 × 91.25 計算。",
    "金額依標示匯率換算為 " + D.unit_label + ",趨勢圖使用同一匯率(固定匯率),因此反映營運變化而非匯率變動。",
    "＊ 多角化公司(如化工、特用化學品集團)的指標反映整家公司,不等於其靶材事業的表現。",
    "各國會計準則、財年(日本多為 3 月制)不同,季度一律依季末日期對齊日曆季度。",
    ...D.industry_notes,
    "本儀表板僅為財務資料的量化整理,不構成投資建議。",
  ];
  for (const t of items) ul.appendChild(el("li", {}, t));
}

function renderAll() {
  renderTiles(); renderRank(); renderScatter(); renderTrend(); renderTable(); renderSignals();
}

renderHeader();
buildFilters();
addTrend(state.focus, true);
for (const c of D.companies) if (Object.keys(state.trendSel).length < 3) addTrend(c.ticker, false);
renderAll();
renderMonthly();
renderNotes();
</script>
