# 靶材產業網站:內網網頁主機的 Nginx 設定範例
# - 只開 HTTPS 443,憑證由公司內部 CA 簽發
# - 由 oauth2-proxy 串接 Entra ID / AD 做單一登入(SSO),未登入者一律導向登入頁
# - 網站是純靜態檔案,伺服器不執行任何程式;網站目錄由蒐集主機推送,這裡只讀
# 把 target-news.corp.example、憑證路徑與 oauth2-proxy 位址換成貴公司的設定。

server {
    listen 80;
    server_name target-news.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name target-news.corp.example;

    ssl_certificate     /etc/nginx/tls/target-news.crt;
    ssl_certificate_key /etc/nginx/tls/target-news.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /srv/target-news/site;
    index index.html;

    # 單一登入:oauth2-proxy(例如 --provider=entra-id)在本機 4180 埠
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        try_files $uri $uri/ =404;
    }

    # 安全標頭(頁面內嵌 script/style,因此 CSP 暫時需要 'unsafe-inline')
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/target-news.access.log;
}
